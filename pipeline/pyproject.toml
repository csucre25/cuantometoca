[project]
name = "pipeline"
version = "0.1.0"
description = "Vigilancia normativa, borradores con LLM y bot de Telegram por site"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3",
  "pymupdf>=1.24",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "aiogram>=3.10",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
