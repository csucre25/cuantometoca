name: deploy

# Secretos por site (sufijo = site_id en mayúsculas): CF_ACCOUNT_ID_*, CF_API_TOKEN_*, CF_BEACON_TOKEN_*,
# CONTACT_EMAIL_* y, opcionales, TELEGRAM_* y ADSENSE_*. Detalle en README.md → Publicar un site.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "pipeline/**"]
  workflow_dispatch:
    inputs:
      site:
        description: "site_id a desplegar (vacío = todos los habilitados)"
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sites:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - id: list
        # Lee config/sites/*.yaml (excepto _template) con enabled: true.
        # Salida: {"include":[{"site":"pe","site_upper":"PE","pages_project":"calc-laborales-pe"}]}
        run: python3 scripts/list_sites.py --only "${{ github.event.inputs.site }}" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: sites
    if: ${{ needs.sites.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.sites.outputs.matrix) }}
    env:
      SITE: ${{ matrix.site }}
      # Nombres genéricos: site-loader.mjs los prioriza sobre los *_<SITE> (docs/02 §7).
      # Los valores públicos (correo, token de analytics, GA4) se aceptan como secreto o como variable.
      ADSENSE_CLIENT: ${{ secrets[format('ADSENSE_CLIENT_{0}', matrix.site_upper)] }}
      ADSENSE_SLOT_AFTER_RESULT: ${{ secrets[format('ADSENSE_SLOT_AFTER_RESULT_{0}', matrix.site_upper)] }}
      ADSENSE_SLOT_IN_BREAKDOWN: ${{ secrets[format('ADSENSE_SLOT_IN_BREAKDOWN_{0}', matrix.site_upper)] }}
      ADSENSE_SLOT_IN_ARTICLE: ${{ secrets[format('ADSENSE_SLOT_IN_ARTICLE_{0}', matrix.site_upper)] }}
      CF_BEACON_TOKEN: ${{ secrets[format('CF_BEACON_TOKEN_{0}', matrix.site_upper)] || vars[format('CF_BEACON_TOKEN_{0}', matrix.site_upper)] }}
      CONTACT_EMAIL: ${{ secrets[format('CONTACT_EMAIL_{0}', matrix.site_upper)] || vars[format('CONTACT_EMAIL_{0}', matrix.site_upper)] }}
      GA4_ID: ${{ secrets[format('GA4_ID_{0}', matrix.site_upper)] || vars[format('GA4_ID_{0}', matrix.site_upper)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate-config
      - run: pnpm test
      - name: Build (falla si falta una variable requerida del site)
        run: |
          set -o pipefail
          pnpm --filter @calc/web build 2>&1 | tee build.log
        env:
          STRICT_ENV: "1"
      - name: Motivo del fallo del build como anotación
        if: failure()
        run: grep -iE "error|faltan" build.log | grep -v "::error" | head -5 | sed 's/^/::error title=Build::/' || true
      - name: Sin dominios hardcodeados
        run: python3 scripts/check_no_hardcoded_domains.py
      - name: Parámetros sin verificar (aviso, no bloquea)
        run: python3 scripts/check_unverified_params.py --country "${{ matrix.site }}"
      - name: Deploy a Cloudflare Pages (cuenta del site)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('CF_API_TOKEN_{0}', matrix.site_upper)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('CF_ACCOUNT_ID_{0}', matrix.site_upper)] }}
        run: npx --yes wrangler@4.146.0 pages deploy apps/web/dist --project-name="${{ matrix.pages_project }}" --branch=main --commit-dirty=true
      - name: Notificar a Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets[format('TELEGRAM_BOT_TOKEN_{0}', matrix.site_upper)] }}
          TG_CHAT: ${{ secrets[format('TELEGRAM_ADMIN_CHAT_ID_{0}', matrix.site_upper)] }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then
            texto="🚀 Publicado el site ${SITE} (commit ${GITHUB_SHA::7})"
          else
            texto="❌ Falló el deploy del site ${SITE}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" --data-urlencode text="${texto}" > /dev/null || true
