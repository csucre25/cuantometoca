name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "pipeline/**"]
  workflow_dispatch:
    inputs:
      site:
        description: "site_id a desplegar (vacío = todos los habilitados)"
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sites:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Lee config/sites/*.yaml (excepto _template) con enabled: true.
        # Salida: {"include":[{"site":"pe","site_upper":"PE","pages_project":"calc-laborales-pe"}]}
        run: |
          python3 scripts/list_sites.py --only "${{ github.event.inputs.site }}" >> "$GITHUB_OUTPUT"

  build-deploy:
    needs: sites
    if: ${{ needs.sites.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.sites.outputs.matrix) }}
    env:
      SITE: ${{ matrix.site }}
      ADSENSE_CLIENT: ${{ secrets[format('ADSENSE_CLIENT_{0}', matrix.site_upper)] }}
      CF_BEACON_TOKEN: ${{ secrets[format('CF_BEACON_TOKEN_{0}', matrix.site_upper)] }}
      CONTACT_EMAIL: ${{ secrets[format('CONTACT_EMAIL_{0}', matrix.site_upper)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate-config
      - run: pnpm test
      - run: pnpm --filter @calc/web build
        env:
          STRICT_ENV: "1"   # falla si falta una variable requerida del site
      - name: Deploy a Cloudflare Pages (cuenta del site)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('CF_API_TOKEN_{0}', matrix.site_upper)] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets[format('CF_ACCOUNT_ID_{0}', matrix.site_upper)] }}
        run: npx wrangler@3 pages deploy apps/web/dist --project-name="${{ matrix.pages_project }}" --branch=main
      - name: Notificar a Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets[format('TELEGRAM_BOT_TOKEN_{0}', matrix.site_upper)] }}
          TG_CHAT: ${{ secrets[format('TELEGRAM_ADMIN_CHAT_ID_{0}', matrix.site_upper)] }}
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="Deploy ${SITE}: ${STATUS} (${GITHUB_SHA::7})" > /dev/null || true
