# Servicios locales (PC o servidor Ubuntu con Docker). Guía: README.md → Servicios locales.
# - bot-pe: bot de Telegram del site Perú (polling).
# - worker: revisión diaria de normas y AFP de los sites habilitados (hora en watchers.yaml).
# Ambos comparten la base SQLite de pipeline/data: el bot aprueba lo que el worker detecta.
x-pipeline: &pipeline
  build: ./pipeline
  env_file: .env
  environment:
    CONFIG_DIR: /app/config
    REPO_DIR: /repo
    TZ: America/Lima
  volumes:
    - ./config:/app/config:ro
    - ./:/repo            # base SQLite en pipeline/data y, más adelante, commits de lo aprobado
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  bot-pe:
    <<: *pipeline
    command: ["python", "-m", "pipeline.cli", "bot", "--site", "pe"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  worker:
    <<: *pipeline
    command: ["python", "-m", "pipeline.cli", "worker"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
